# Simple tmux configuration
 
# Change prefix from Ctrl-b to Ctrl-a (Ctrl-Space reserved for nvim)
unbind C-b
# Use Ctrl-a as tmux leader (common alternative to Ctrl-b)
set-option -g prefix C-a
bind-key C-a send-prefix
 
# split panes with vim-style keybindings
bind v split-window -h    # vertical split (side by side)
bind s split-window -v    # Horizontal split (top/bottom)

unbind [
bind Escape copy-mode
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -sel clipboard -i"

unbind r
bind r command-prompt -I "#W" "rename-window '%%'"
 
# tmux sessionizer
bind-key -r f run-shell "tmux neww ~/scripts/tmux-sessionizer.sh"

bind m new-session -A -s main
bind y new-session -A -s yazi "y"

# pick new one
bind-key -r p run-shell "tmux "

bind-key -r k run-shell "tmux kill-window"


 
# Create new tab/window
unbind C-t
bind t new-window
 
# Move between tabs/windows with Shift+arrow keys (no prefix needed)
bind -n S-Left previous-window
bind -n S-Right next-window

# Start window numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
 
# Enable mouse support (useful for resizing panes and scrolling)
set -g mouse on
 
# Increase scrollback buffer size
set -g history-limit 10000
 
set -g xterm-keys on
set -g default-terminal "tmux-256color"
set -s escape-time 0

# Visual improvements — theme colors (auto light/dark, see ~/.tmux/theme-current.conf)
source-file -q ~/.tmux/theme-current.conf

 
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

 # supposing you use catppuccin moccha
 #set -g @tmux-dotbar-bg "#eff1f5"
 #set -g @tmux-dotbar-fg "#acb0be"
 #set -g @tmux-dotbar-fg-current "#4c4f69" 
 #set -g @tmux-dotbar-fg-session "#7c7f93"
 #set -g @tmux-dotbar-fg-prefix "#8839ef"

 # tmux-dotbar colors are set in ~/.tmux/theme-current.conf (sourced above)
set -g @plugin 'vaaleyard/tmux-dotbar'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'


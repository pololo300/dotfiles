# GitHub Dark theme — tmux status bar

# Copy mode / selection highlight
set -g mode-style "bg=#264f78,fg=#c9d1d9"

# Status bar
set -g status-style bg="#010409",fg="#8b949e"
set -g window-status-style bg="#010409",fg="#8b949e"
set -g window-status-current-style bg="#010409",fg="#c9d1d9",bold

# tmux-dotbar
set -g @tmux-dotbar-bg "#010409"
set -g @tmux-dotbar-fg "#8b949e"
set -g @tmux-dotbar-fg-current "#58a6ff"
set -g @tmux-dotbar-fg-session "#6e7681"
set -g @tmux-dotbar-fg-prefix "#bc8cff"

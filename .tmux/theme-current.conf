# GitHub Light theme — tmux status bar

# Copy mode / selection highlight
set -g mode-style "bg=#bbdeff,fg=#24292f"

# Status bar
set -g status-style bg="#f6f8fa",fg="#57606a"
set -g window-status-style bg="#f6f8fa",fg="#57606a"
set -g window-status-current-style bg="#f6f8fa",fg="#24292f",bold

# tmux-dotbar
set -g @tmux-dotbar-bg "#f6f8fa"
set -g @tmux-dotbar-fg "#57606a"
set -g @tmux-dotbar-fg-current "#0969da"
set -g @tmux-dotbar-fg-session "#6e7781"
set -g @tmux-dotbar-fg-prefix "#8250df"
